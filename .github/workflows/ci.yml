name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # prisma.config.ts resolves DIRECT_URL at config-load time for
          # every Prisma CLI command (docs/architecture.md §5.6) — but
          # `prisma generate` itself never opens a database connection, it
          # only reads schema.prisma and writes the generated client code.
          # A syntactically-valid placeholder is sufficient and safe here,
          # same reasoning as the Build step's placeholder DATABASE_URL below.
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build`'s type-checking pass and static
          # generation succeed without real Supabase/DB credentials. No
          # runtime DB/Supabase calls happen during a static build.
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          # npm's `prebuild` hook now runs `prisma generate` before this
          # step's `next build` — prisma.config.ts resolves DIRECT_URL at
          # config-load time even though `generate` never opens a real
          # connection (same reasoning as the `Generate Prisma client`
          # step above; a syntactically-valid placeholder is sufficient).
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          # Phase 9: @ai-sdk/anthropic's default export only reads this at
          # call time, not at build/import time (verified locally — the
          # build succeeds without it) — placeholder added anyway, for the
          # same defensive reasoning as the other placeholders here.
          ANTHROPIC_API_KEY: "placeholder"

  test-db:
    name: Isolation & integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_owner_pw_ephemeral
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Same as the build job's Generate Prisma client step: only
          # needed so prisma.config.ts's env("DIRECT_URL") resolves at
          # config-load time — `prisma generate` makes no DB connection.
          # The actual test run below connects to the postgres service
          # container itself, via tests/helpers/testDb.ts's own hardcoded
          # owner URL (IS_CI branch), never via this placeholder.
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Isolation & integration tests
        run: npm run test:db
